name: FAIZMART INDIA SHOPPING V50 APK

concurrency:
  group: faizmart-v50-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare V50 web source
        run: |
          set -e
          mkdir -p src
          cp main.js src/main.js
          cp style.css src/style.css
          test -f index.html
          test -f src/main.js
          test -f src/style.css

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build V50 web app
        env:
          VITE_SUPABASE_URL: https://yfbnzywamznaxoooqpna.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_mqRrjkQ4qs_oFqaKkKKuXw_hWy5XlFy
        run: |
          npm run build
          test -s dist/assets/faizmart-logo.jpg
          grep -q 'faizmart-logo.jpg' dist/index.html

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@7.4.3 @capacitor/cli@7.4.3 @capacitor/android@7.4.3 @capacitor/camera@7.0.1

      - name: Create Android project
        run: |
          set -e
          npx cap init "FAIZMART INDIA SHOPPING" "com.faizmart.india.shopping.v50" --web-dir dist
          npx cap add android
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          import os, re, xml.etree.ElementTree as ET
          source = Image.open("public/assets/faizmart-logo.jpg").convert("RGBA")
          sizes = {"mdpi":48, "hdpi":72, "xhdpi":96, "xxhdpi":144, "xxxhdpi":192}
          for density, size in sizes.items():
              folder = f"android/app/src/main/res/mipmap-{density}"
              os.makedirs(folder, exist_ok=True)
              icon = source.copy()
              icon.thumbnail((size, size), Image.Resampling.LANCZOS)
              canvas = Image.new("RGBA", (size, size), "white")
              canvas.alpha_composite(icon, ((size-icon.width)//2, (size-icon.height)//2))
              canvas.convert("RGB").save(f"{folder}/ic_launcher.png", "PNG")
              mask = Image.new("L", (size, size), 0)
              ImageDraw.Draw(mask).ellipse((0, 0, size-1, size-1), fill=255)
              round_icon = canvas.copy()
              round_icon.putalpha(mask)
              round_icon.save(f"{folder}/ic_launcher_round.png", "PNG")
              fg_size = int(size * 1.5)
              fg = Image.new("RGBA", (fg_size, fg_size), (0,0,0,0))
              logo = source.copy()
              logo.thumbnail((int(fg_size*.66), int(fg_size*.66)), Image.Resampling.LANCZOS)
              fg.alpha_composite(logo, ((fg_size-logo.width)//2, (fg_size-logo.height)//2))
              fg.save(f"{folder}/ic_launcher_foreground.png", "PNG")
          os.makedirs("android/app/src/main/res/mipmap-anydpi-v26", exist_ok=True)
          os.makedirs("android/app/src/main/res/values", exist_ok=True)
          open("android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml","w").write("""<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/faizmart_icon_background"/><foreground android:drawable="@mipmap/ic_launcher_foreground"/></adaptive-icon>""")
          open("android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml","w").write("""<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/faizmart_icon_background"/><foreground android:drawable="@mipmap/ic_launcher_foreground"/></adaptive-icon>""")
          open("android/app/src/main/res/values/faizmart_colors.xml","w").write("<resources><color name='faizmart_icon_background'>#FFFFFF</color></resources>")
          PY
          npx cap sync android
          npx cap copy android

          python3 - <<'PY'
          import os, re
          path = "android/app/build.gradle"
          with open(path, encoding="utf-8") as f:
              gradle = f.read()
          version_code = int(os.environ.get("GITHUB_RUN_NUMBER", "1"))
          if re.search(r"\bversionCode\s+\d+", gradle):
              gradle = re.sub(r"(\bversionCode\s+)\d+", rf"\g<1>{version_code}", gradle, count=1)
          else:
              gradle, count = re.subn(r"(defaultConfig\s*\{)", rf"\g<1>\n        versionCode {version_code}", gradle, count=1)
              if count != 1:
                  raise SystemExit("Could not set Android versionCode")
          if re.search(r'\bversionName\s+"[^"]+"', gradle):
              gradle = re.sub(r'\bversionName\s+"[^"]+"', f'versionName "50.0.{version_code}"', gradle, count=1)
          with open(path, "w", encoding="utf-8") as f:
              f.write(gradle)
          print(f"Configured versionCode={version_code}, versionName=50.0.{version_code}")
          PY
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          path = "android/app/src/main/AndroidManifest.xml"
          android_ns = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", android_ns)
          tree = ET.parse(path)
          root = tree.getroot()
          app = root.find("application")
          if app is None:
              raise SystemExit("AndroidManifest.xml has no application element")
          app.set("{" + android_ns + "}icon", "@mipmap/ic_launcher")
          app.set("{" + android_ns + "}roundIcon", "@mipmap/ic_launcher_round")
          tree.write(path, encoding="utf-8", xml_declaration=True)
          check_root = ET.parse(path).getroot()
          check_app = check_root.find("application")
          assert check_app is not None
          assert check_app.get("{" + android_ns + "}icon") == "@mipmap/ic_launcher"
          assert check_app.get("{" + android_ns + "}roundIcon") == "@mipmap/ic_launcher_round"
          print("Verified FAIZMART launcher and round icon manifest attributes")
          PY

          python3 - <<'PY'
          path = "android/app/build.gradle"
          with open(path, encoding="utf-8") as f:
              gradle = f.read()
          signing = """
          android {
              signingConfigs {
                  release {
                      if (System.getenv("FAIZMART_KEYSTORE_FILE") != null) {
                          storeFile file(System.getenv("FAIZMART_KEYSTORE_FILE"))
                          storePassword System.getenv("FAIZMART_KEYSTORE_PASSWORD")
                          keyAlias System.getenv("FAIZMART_KEY_ALIAS")
                          keyPassword System.getenv("FAIZMART_KEY_PASSWORD")
                      }
                  }
              }
              buildTypes {
                  release {
                      if (System.getenv("FAIZMART_KEYSTORE_FILE") != null) {
                          signingConfig signingConfigs.release
                      }
                  }
              }
          }
          """
          if "signingConfigs {" not in gradle:
              with open(path, "a", encoding="utf-8") as f:
                  f.write("\n" + signing)
          print("Prepared optional persistent release signing in app/build.gradle")
          PY

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: faizmart-v50-debug-keystore-v1

      - name: Ensure stable Android debug signing key
        run: |
          mkdir -p ~/.android
          if [ ! -s ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Prepare persistent release signing
        env:
          FAIZMART_KEYSTORE_BASE64: ${{ secrets.FAIZMART_KEYSTORE_BASE64 }}
          FAIZMART_KEYSTORE_PASSWORD: ${{ secrets.FAIZMART_KEYSTORE_PASSWORD }}
          FAIZMART_KEY_ALIAS: ${{ secrets.FAIZMART_KEY_ALIAS }}
          FAIZMART_KEY_PASSWORD: ${{ secrets.FAIZMART_KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$FAIZMART_KEYSTORE_BASE64" ]; then
            echo "$FAIZMART_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/faizmart-release.jks"
            echo "FAIZMART_KEYSTORE_FILE=$RUNNER_TEMP/faizmart-release.jks" >> "$GITHUB_ENV"
            echo "FAIZMART_KEYSTORE_PASSWORD=$FAIZMART_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "FAIZMART_KEY_ALIAS=$FAIZMART_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "FAIZMART_KEY_PASSWORD=$FAIZMART_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Persistent release key loaded"
          else
            echo "Release key not configured; building debug APK for validation"
          fi

      - name: Build APK
        working-directory: android
        run: |
          set -e
          if [ -n "$FAIZMART_KEYSTORE_FILE" ]; then
            ./gradlew clean assembleRelease --stacktrace
          else
            ./gradlew clean assembleDebug --stacktrace
          fi

      - name: Verify APK package and signature
        run: |
          set -e
          if [ -n "$FAIZMART_KEYSTORE_FILE" ]; then
            APK=android/app/build/outputs/apk/release/app-release.apk
            echo "APK_BUILD_TYPE=release" >> "$GITHUB_ENV"
          else
            APK=android/app/build/outputs/apk/debug/app-debug.apk
            echo "APK_BUILD_TYPE=debug (persistent signing secrets not configured)" >> "$GITHUB_ENV"
          fi
          test -s "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt" dump badging "$APK" | grep -E "package: name='com.faizmart.india.shopping.v50'|application-label:'FAIZMART INDIA SHOPPING'"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify "$APK"

      - name: Upload V50 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FAIZMART-INDIA-SHOPPING-V50-INSTALL
          path: android/app/build/outputs/apk/**/*.apk
