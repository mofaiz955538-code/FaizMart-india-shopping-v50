name: FAIZMART INDIA SHOPPING V50 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare V50 web source
        run: |
          set -e
          mkdir -p src
          cp main.js src/main.js
          cp style.css src/style.css
          test -f index.html
          test -f src/main.js
          test -f src/style.css

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build V50 web app
        env:
          VITE_SUPABASE_URL: https://yfbnzywamznaxoooqpna.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_mqRrjkQ4qs_oFqaKkKKuXw_hWy5XlFy
        run: npm run build

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@7.4.3 @capacitor/cli@7.4.3 @capacitor/android@7.4.3 @capacitor/camera@7.0.1

      - name: Create Android project
        run: |
          npx cap init "FAIZMART INDIA SHOPPING" "com.faizmart.india.shopping.v50" --web-dir dist
          npx cap add android
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-${density}"
            rm -f "android/app/src/main/res/mipmap-${density}/ic_launcher.png" "android/app/src/main/res/mipmap-${density}/ic_launcher_round.png" "android/app/src/main/res/mipmap-${density}/ic_launcher_foreground.png"
            cp public/assets/faizmart-logo.jpg "android/app/src/main/res/mipmap-${density}/ic_launcher.jpg"
            cp public/assets/faizmart-logo.jpg "android/app/src/main/res/mipmap-${density}/ic_launcher_round.jpg"
            cp public/assets/faizmart-logo.jpg "android/app/src/main/res/mipmap-${density}/ic_launcher_foreground.jpg"
          done
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26 android/app/src/main/res/values
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/faizmart_icon_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/faizmart_icon_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF
          cat > android/app/src/main/res/values/faizmart_colors.xml <<'EOF'
          <resources><color name="faizmart_icon_background">#FFFFFF</color></resources>
          EOF
          npx cap sync android
          npx cap copy android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Find APK
        if: always()
        run: find android -type f -name "*.apk" -print

      - name: Upload V50 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FAIZMART-INDIA-SHOPPING-V50-INSTALL
          path: android/app/build/outputs/apk/debug/app-debug.apk
