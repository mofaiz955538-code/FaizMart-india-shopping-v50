name: FAIZMART INDIA SHOPPING V50 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare V50 web source
        run: |
          set -e
          mkdir -p src
          cp main.js src/main.js
          cp style.css src/style.css
          test -f index.html
          test -f src/main.js
          test -f src/style.css

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          

      - name: Install dependencies
        run: npm install

      - name: Build V50 web app
        env:
          VITE_SUPABASE_URL: https://yfbnzywamznaxoooqpna.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_mqRrjkQ4qs_oFqaKkKKuXw_hWy5XlFy
        run: npm run build

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@7.4.3 @capacitor/cli@7.4.3 @capacitor/android@7.4.3

      - name: Create Android project
        run: |
          npx cap init "FAIZMART INDIA SHOPPING" "com.faizmart.india.shopping" --web-dir dist
          npx cap add android
          npx cap copy android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Find APK
        if: always()
        run: find android -type f -name "*.apk" -print

      - name: Upload V50 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FAIZMART-INDIA-SHOPPING-V50-NEW
          path: android/app/build/outputs/apk/debug/app-debug.apk
