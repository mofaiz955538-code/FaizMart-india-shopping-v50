name: FAIZMART INDIA SHOPPING V50 APK

concurrency:
  group: faizmart-v50-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare V50 web source
        run: |
          set -e
          mkdir -p src
          cp main.js src/main.js
          cp style.css src/style.css
          test -f index.html
          test -f src/main.js
          test -f src/style.css

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build V50 web app
        env:
          VITE_SUPABASE_URL: https://yfbnzywamznaxoooqpna.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_mqRrjkQ4qs_oFqaKkKKuXw_hWy5XlFy
        run: |
          npm run build
          test -s dist/assets/faizmart-logo.jpg
          grep -q 'faizmart-logo.jpg' dist/index.html

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@7.4.3 @capacitor/cli@7.4.3 @capacitor/android@7.4.3 @capacitor/camera@7.0.1

      - name: Create Android project
        run: |
          set -e
          npx cap init "FAIZMART INDIA SHOPPING" "com.faizmart.india.shopping.v50" --web-dir dist
          npx cap add android
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-${density}"
            cp public/assets/faizmart-logo.jpg "android/app/src/main/res/mipmap-${density}/ic_launcher.png"
            cp public/assets/faizmart-logo.jpg "android/app/src/main/res/mipmap-${density}/ic_launcher_round.png"
            cp public/assets/faizmart-logo.jpg "android/app/src/main/res/mipmap-${density}/ic_launcher_foreground.png"
          done
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26 android/app/src/main/res/values
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/faizmart_icon_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/faizmart_icon_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF
          cat > android/app/src/main/res/values/faizmart_colors.xml <<'EOF'
          <resources><color name="faizmart_icon_background">#FFFFFF</color></resources>
          EOF
          npx cap sync android
          npx cap copy android
          python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          path = "android/app/src/main/AndroidManifest.xml"
          source = open(path, encoding="utf-8").read()
          if not re.search(r'<application\\b', source):
              raise SystemExit("AndroidManifest.xml has no application element")
          source = re.sub(
              r'<application\\b',
              '<application android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"',
              source,
              count=1,
          )
          open(path, "w", encoding="utf-8").write(source)
          root = ET.parse(path).getroot()
          ns = "{http://schemas.android.com/apk/res/android}"
          app = root.find("application")
          assert app is not None
          assert app.get(ns + "icon") == "@mipmap/ic_launcher"
          assert app.get(ns + "roundIcon") == "@mipmap/ic_launcher_round"
          print("Verified FAIZMART launcher and round icon manifest attributes")
          PY

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK package and signature
        run: |
          set -e
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt" dump badging "$APK" | grep -E "package: name='com.faizmart.india.shopping.v50'|application-label:'FAIZMART INDIA SHOPPING'"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify "$APK"

      - name: Upload V50 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FAIZMART-INDIA-SHOPPING-V50-INSTALL
          path: android/app/build/outputs/apk/debug/app-debug.apk
