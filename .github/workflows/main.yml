name: FAIZMART INDIA SHOPPING V50 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract V50 ZIP
        run: |
          mkdir -p v50
          unzip -o FAIZMART_INDIA_SHOPPING_V50_APK_BUILD_READY.zip -d v50

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find Android project
        run: |
          find v50 -maxdepth 6 \( -name settings.gradle -o -name settings.gradle.kts \) -print

      - name: Build APK
        working-directory: v50
        run: |
          PROJECT_DIR=$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No Gradle Android project found in V50 ZIP."
            exit 1
          fi
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Find APK
        if: always()
        run: |
          find v50 -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FAIZMART-V50-debug-apkFAIZMART_INDIA_SHOPPING_V50_APK_BUILD_READY.zip
          path: v50/**/build/outputs/apk/**/*.apk
