name: FAIZMART Web Live Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'main.js'
      - 'style.css'
      - 'index.html'
      - 'package.json'
      - 'vite.config.js'
      - 'public/**'
      - 'assets/**'
      - '.github/workflows/deploy-web.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: faizmart-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare V50 web source
        run: |
          set -e
          mkdir -p src
          cp main.js src/main.js
          cp style.css src/style.css
          test -s src/main.js
          test -s src/style.css
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare V50 web source
        run: |
          mkdir -p src
          cp main.js src/main.js
          cp style.css src/style.css
          test -s src/main.js
          test -s src/style.css
      - name: Install dependencies
        run: npm install
      - name: Build web app
        env:
          VITE_SUPABASE_URL: https://yfbnzywamznaxoooqpna.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_mqRrjkQ4qs_oFqaKkKKuXw_hWy5XlFy
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
